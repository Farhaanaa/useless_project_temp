<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Chat · VerutheAI</title>

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Kalam:wght@400;700&family=Noto+Sans+Malayalam:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/chat.css" />
  </head>

  <body>
    <main class="chat-page">
      <!-- SIDEBAR -->

      <aside class="sidebar">
        <div>
          <!-- BRAND -->

          <div class="chat-brand">
            <img
              src="assets/mascot/logo.png"
              class="chat-logo"
              alt="VerutheAI logo"
            />

            <div>
              <div class="chat-brand-name">വെറുതെAI</div>

              <div class="chat-brand-tagline">for no reason at all.</div>
            </div>
          </div>

          <!-- NAVIGATION -->

          <nav class="sidebar-nav">
            <a href="chat.html" class="sidebar-item active">
              <img
                src="assets/decorations/small_flower.png"
                class="nav-decoration"
                alt=""
              />

              Chat
            </a>

            <a href="index.html" class="sidebar-item">
              <img
                src="assets/decorations/sprout.png"
                class="nav-decoration"
                alt=""
              />

              Home
            </a>
          </nav>
        </div>

        <!-- SIDEBAR NOTE -->

        <div class="sidebar-note">
          Ask anything.<br />

          Get <span>nothing useful.</span>
        </div>
      </aside>

      <!-- CHAT AREA -->

      <section class="chat-container">
        <!-- HEADER -->

        <header class="chat-header">
          <div>
            <h1>Chat with VerutheAI</h1>

            <p>Ask something completely unnecessary.</p>
          </div>

          <div class="header-note">
            scientifically<br />
            questionable

            <img
              src="assets/decorations/leaf.png"
              class="header-decoration"
              alt=""
            />
          </div>
        </header>

        <!-- MESSAGES -->

        <div class="messages" id="messages">
          <!-- Score card will be moved here by JavaScript -->

          <div class="score-card" id="scoreCard" style="display: none">
            <div class="score-info">
              <span> Uselessness Level </span>

              <div class="score-bar">
                <div class="score-fill" id="scoreFill" style="width: 0%"></div>
              </div>
            </div>

            <div class="score-number" id="scoreNumber">0%</div>

            <div class="score-note">
              impressively<br />
              unnecessary
            </div>
          </div>
        </div>

        <!-- UNLOCK -->

        <div class="unlock-card" id="unlockCard" style="display: none">
          <img src="assets/decorations/flower.png" class="unlock-icon" alt="" />

          <div class="unlock-text">
            <strong> A flower has appeared! </strong>

            <span> Your question was sufficiently useless. </span>
          </div>

          <button type="button" id="placeButton">Place it</button>

          <button type="button" class="secondary-button" id="laterButton">
            Later
          </button>
        </div>

        <!-- INPUT -->

        <form class="chat-input-area" id="chatForm">
          <button
            type="button"
            class="attachment-button"
            title="Absolutely unnecessary"
          >
            <img
              src="assets/decorations/small_flower.png"
              class="input-decoration"
              alt=""
            />
          </button>

          <input
            type="text"
            id="messageInput"
            placeholder="Ask VerutheAI something..."
            autocomplete="off"
          />

          <button
            type="submit"
            class="send-button"
            title="Ask something useless"
          >
            ↑
          </button>
        </form>
      </section>

      <!-- DECORATIONS -->

      <img
        src="assets/decorations/leaf.png"
        class="chat-decoration decoration-top-right"
        alt=""
      />

      <img
        src="assets/decorations/sprout.png"
        class="chat-decoration decoration-bottom-left"
        alt=""
      />

      <img
        src="assets/decorations/butterfly.png"
        class="chat-decoration decoration-bottom-right"
        alt=""
      />

      <img
        src="assets/decorations/flower.png"
        class="chat-decoration decoration-middle-right"
        alt=""
      />
    </main>

    <script src="js/chat.js"></script>
  </body>
</html>
